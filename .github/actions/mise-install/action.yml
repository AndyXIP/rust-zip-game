name: Setup mise
description: Install mise and the pinned Rust toolchain, and cache cargo artifacts

runs:
  using: composite
  steps:
    - name: Install mise
      uses: jdx/mise-action@v4.2.0
      with:
        install: true
        cache: true

    - name: Cache cargo registry and target dir
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: zip
